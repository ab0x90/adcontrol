<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adcontrol — AD Object Control Analyzer</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{color-scheme:light dark;--hi:#e5484d;--med:#e0a800;--lo:#3a9e6a;--bg:#0f1012;--panel:#1a1b1e;--line:#2c2e33;--fg:#e7e7ea;--dim:#8b8d93;--accent:#5b8def}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:.8rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0}header .tag{color:var(--dim);font-size:.8rem}
header .status{margin-left:auto;font-size:.8rem;color:var(--dim)}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:1rem;padding:1rem;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.panel h2{font-size:.95rem;margin:0 0 .7rem}
label{display:block;font-size:.75rem;color:var(--dim);margin:.5rem 0 .15rem;text-transform:uppercase;letter-spacing:.03em}
input,select{width:100%;padding:.45rem .55rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit}
.row{display:flex;gap:.5rem}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:.4rem;margin:.4rem 0;font-size:.85rem;color:var(--fg)}
.chk input{width:auto}
button{padding:.5rem .9rem;background:var(--accent);color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:400}
button:disabled{opacity:.5;cursor:not-allowed}
.log{margin-top:.8rem;max-height:220px;overflow:auto;font:12px/1.45 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.5rem}
.log div{white-space:pre-wrap}.log .error{color:var(--hi)}.log .warn{color:var(--med)}.log .info{color:var(--dim)}
.search{margin-bottom:.6rem}
.plist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pitem{padding:.4rem .6rem;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:.5rem;align-items:center}
.pitem:hover{background:#ffffff0a}.pitem.sel{background:var(--accent)22;border-left:3px solid var(--accent)}
.pill{font-size:.62rem;text-transform:uppercase;padding:.05em .4em;border-radius:99px;background:#ffffff18;color:var(--dim)}
.pill.user{background:#3a9e6a33;color:#7fdcaa}.pill.group{background:#5b8def33;color:#9bbcf5}.pill.computer{background:#e0a80033;color:#f0cf6a}
.pill.gpo{background:#b06de033;color:#d3a6f0}.pill.ou{background:#4bb6c933;color:#8fd6e2}.pill.domain{background:#e07a5f33;color:#f0b3a0}.pill.container{background:#8a8f9a33;color:#c2c6cf}
.tfilter{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.5rem}
.tchip{font-size:.66rem;text-transform:uppercase;padding:.2em .55em;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-weight:600;user-select:none;width:auto}
.tchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tchip .cnt{opacity:.7;font-weight:400;margin-left:.3em}
.qdesc{font-size:.75rem;color:var(--dim);margin:.4rem 0 .2rem;line-height:1.4}
.qmeta{font-size:.72rem;color:var(--accent);font-weight:600;min-height:1em}
.pitem .note{font-size:.68rem;color:var(--dim);margin-left:auto;text-align:right;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcaret{width:.9em;flex:0 0 auto;color:var(--dim);font-size:.7rem;cursor:pointer}
.qcaret.ph{cursor:default}
.mcount{font-size:.66rem;color:var(--accent);font-weight:600;white-space:nowrap}
.plabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{background:#00000022;border-bottom:1px solid var(--line)}
.mitem{display:flex;gap:.45rem;align-items:center;padding:.28rem .6rem .28rem 1.6rem;font-size:.78rem;cursor:pointer;border-top:1px solid #ffffff08}
.mitem:hover{background:#ffffff0a}
.mdis{font-size:.6rem;color:var(--med);margin-left:auto}
.mnote{padding:.3rem .6rem .3rem 1.6rem;font-size:.68rem;color:var(--dim)}
.subjhead{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.subjhead h2{margin:0;font-size:1.2rem}
.cards{display:flex;gap:.7rem;flex-wrap:wrap;margin-left:auto}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.4rem .8rem;text-align:center;min-width:70px}
.card b{display:block;font-size:1.3rem}.card span{font-size:.68rem;color:var(--dim)}
.dir{margin-bottom:1.3rem}
.dir h3{font-size:.95rem;margin:0 0 .5rem;padding-bottom:.35rem;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:.5rem}
.dir.out h3{border-color:var(--accent)}.dir.in h3{border-color:#b06de0}.dir.gpo h3{border-color:#e0a800}.dir.path h3{border-color:var(--hi)}.dir.sess h3{border-color:#3a9e6a}
.dir.path h3 .phdr{margin-left:auto;font-weight:400;font-size:.8rem;display:flex;align-items:center;gap:.2rem}
.pathcard{border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:6px;padding:.55rem .7rem;margin:.5rem 0;background:#ffffff08}
.pathmeta{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.winbadge{font-size:.72rem;font-weight:700;color:var(--hi);letter-spacing:.02em}
.pathchain{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem;font-size:.82rem;line-height:1.9}
.pnode{padding:.1em .5em;border-radius:5px;border:1px solid var(--line);background:#ffffff10;font-weight:600;white-space:nowrap}
.pnode.src{border-color:var(--accent)}.pnode.group{border-color:#9bbcf5}.pnode.user{border-color:#7fdcaa}.pnode.computer{border-color:#f0cf6a}.pnode.domain{border-color:#e0a800}
.parrow{color:var(--dim);display:inline-flex;align-items:center;gap:.15rem;white-space:nowrap}
.prt{font-size:.66rem;font-weight:700;padding:.05em .4em;border-radius:4px;background:#ffffff14;color:var(--fg)}
.prt.sev-high{color:var(--hi)}.prt.sev-medium{color:var(--med)}.prt.sev-low{color:var(--lo)}
.truncwarn{border:1px solid var(--med);background:#e0a80018;color:var(--fg);border-radius:6px;padding:.5rem .7rem;margin:.3rem 0 .6rem;font-size:.82rem;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:.4rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:.72rem;text-transform:uppercase}
.sev{color:#fff;padding:.05em .5em;border-radius:99px;font-size:.68rem;text-transform:uppercase}
.sev.high{background:var(--hi)}.sev.medium{background:var(--med)}.sev.low{background:var(--lo)}
.broad{background:var(--hi);color:#fff;font-size:.6rem;padding:.03em .35em;border-radius:3px;margin-left:.3em}
.rt{font-weight:600}.scope{color:var(--dim);font-size:.9em}
.none{color:var(--dim);font-style:italic;padding:.5rem 0}
.hidenote{color:var(--dim);font-size:.8rem;font-style:italic;padding:.3rem 0 .5rem}
.noiserow{opacity:.62}
tbody tr{cursor:pointer}
tbody tr:hover{background:#ffffff0d}
.modalWrap{display:none;position:fixed;inset:0;background:#000a;z-index:50;padding:2rem;overflow:auto}
.modalWrap.open{display:flex;align-items:flex-start;justify-content:center}
.modalBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:880px;width:100%;padding:1.4rem 1.6rem;position:relative;box-shadow:0 8px 40px #000a}
.modalX{position:absolute;top:.6rem;right:.8rem;background:none;border:0;color:var(--dim);font-size:1.6rem;line-height:1;cursor:pointer;padding:0}
.modalBox h3{margin:0 0 .2rem;font-size:1.2rem}
.modalBox .sub{color:var(--dim);font-size:.85rem;margin-bottom:1rem}
/* Shrink-to-fit: the bordered box hugs the graphic (up to the modal width, then
   scrolls) instead of stretching full-width and leaving blank space to the right. */
.chainWrap{overflow-x:auto;margin:.4rem auto 1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:max-content;max-width:100%}
.memwrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:.5rem}
.memrow{cursor:pointer}
.memrow:hover{background:#ffffff10}
.memrow.noanalyze{cursor:default;opacity:.6}
.memrow.noanalyze:hover{background:none}
.chainSvg{display:block;height:auto}
.advBlock{margin:.9rem 0}
.advBlock h4{margin:0 0 .3rem;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:.4rem}
.advBlock.off h4{color:#e5484d}.advBlock.def h4{color:#3a9e6a}.advBlock.sum h4{color:var(--dim)}.advBlock.ops h4{color:#e0a800}
.cmds{margin:.5rem 0 0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;font:12px/1.5 ui-monospace,monospace;color:#cdd3da;white-space:pre-wrap;overflow-x:auto}
.bhlink{font-size:.78rem;color:var(--accent);text-decoration:none;margin-left:.4rem;white-space:nowrap}
.bhlink:hover{text-decoration:underline}
.advBlock p{margin:0;font-size:.9rem;line-height:1.5}
.factgrid{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;font-size:.82rem;margin-top:.4rem}
.factgrid .k{color:var(--dim)}.factgrid .v{font-family:ui-monospace,monospace;word-break:break-all}
.exports{display:flex;gap:.5rem;margin-left:auto}
.empty{color:var(--dim);text-align:center;padding:3rem 1rem}
.mono{font-family:ui-monospace,monospace;font-size:.85em;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>adcontrol</h1><span class="tag">AD object-control analyzer</span>
  <span class="status" id="status">not collected</span>
</header>
<div class="wrap">
  <!-- LEFT: pick + collect -->
  <div>
    <div class="panel">
      <h2>Principals</h2>
      <input class="search" id="search" placeholder="search name / DN / SID…" oninput="debouncedSearch()">
      <div class="tfilter" id="tfilter"></div>
      <div class="plist" id="plist"><div class="none" style="padding:.6rem">Collect or load a session first.</div></div>
    </div>

    <div class="panel" id="queriesPanel" style="margin-top:1rem">
      <h2 style="cursor:pointer;user-select:none" onclick="toggleQueries()"><span id="queriesCaret">▾</span> Queries</h2>
      <div id="queriesBody">
        <select id="querySelect" onchange="onQueryPick()">
          <option value="">— pick a query —</option>
        </select>
        <div class="qdesc" id="queryDesc"></div>
        <div class="qmeta" id="queryMeta"></div>
        <div class="plist" id="qlist" style="margin-top:.5rem;display:none"></div>
      </div>
    </div>

    <div class="panel" id="collectPanel" style="margin-top:1rem">
      <h2 style="cursor:pointer;user-select:none" onclick="toggleCollect()"><span id="collectCaret">▾</span> Collect</h2>
      <div id="collectBody">
      <label>Domain Controller (host / IP)</label>
      <input id="dc" placeholder="dc01.corp.local">
      <div class="row">
        <div><label>Username</label><input id="username" placeholder="user"></div>
        <div><label>Domain</label><input id="domain" placeholder="corp.local"></div>
      </div>
      <label>Password</label><input id="password" type="password" placeholder="(or use hash / kerberos)">
      <label>NT hash (PtH)</label><input id="nthash" placeholder="LM:NT or :NT">
      <div class="chk"><input type="checkbox" id="kerberos"><label style="margin:0;text-transform:none;letter-spacing:0;color:var(--fg)">Kerberos</label></div>
      <div class="chk"><input type="checkbox" id="ldaps"><label style="margin:0;text-transform:none;letter-spacing:0;color:var(--fg)">Force LDAPS</label></div>
      <div class="row"><div><label>AES key (opt)</label><input id="aes_key"></div>
        <div><label>DC IP (opt)</label><input id="dc_ip"></div></div>
      <label style="margin-top:.7rem">Collection tier</label>
      <div class="chk"><input type="checkbox" id="gpo" checked>
        <label style="margin:0;text-transform:none;letter-spacing:0;color:var(--fg)">GPO rights (DC SYSVOL only — no host fan-out)</label></div>
      <label style="margin-top:.4rem">Per-host RDP / admin (touches hosts)</label>
      <select id="host_mode" onchange="document.getElementById('hostsRow').style.display=this.value==='list'?'block':'none'">
        <option value="none">none (DC-only, default)</option>
        <option value="all">all collected computers (noisy)</option>
        <option value="list">specific hosts…</option>
      </select>
      <div id="hostsRow" style="display:none"><label>Hosts (comma-separated or file path)</label><input id="hosts" placeholder="ws01.corp.local,srv02.corp.local"></div>
      <label style="margin-top:.4rem" title="Enumerate who is logged on to each host (NetWkstaUserEnum + NetSessionEnum) — enables HasSession attack paths on a live pull. Fans out to hosts. 'list' reuses the host list above.">Logon sessions (touches hosts)</label>
      <select id="session_mode">
        <option value="none">none (default)</option>
        <option value="all">all collected computers (noisy)</option>
        <option value="list">use the host list above</option>
      </select>
      <div style="margin-top:.8rem;display:flex;gap:.5rem">
        <button id="collectBtn" onclick="startCollect()">Collect</button>
        <select id="sessSel" class="ghost" style="flex:1" onchange="loadSession()"><option value="">load session…</option></select>
      </div>
      <div style="margin-top:.6rem;border-top:1px solid var(--line);padding-top:.6rem">
        <label style="margin-top:0">Offline — import BloodHound zip</label>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input type="file" id="bhFile" accept=".zip,.json" style="flex:1;font-size:.8rem">
          <button class="ghost" onclick="importBloodhound()">Import</button>
        </div>
      </div>
      <div class="log" id="log"></div>
      </div><!-- /collectBody -->
    </div>
  </div>
  <!-- RIGHT: results -->
  <div class="panel" id="results">
    <div class="empty" id="empty">Select a principal to see what it can control (outbound) and who can control it (inbound).</div>
    <div id="detail" style="display:none"></div>
  </div>
</div>
<!-- edge detail modal -->
<div id="modal" class="modalWrap" onclick="if(event.target===this)closeModal()">
  <div class="modalBox">
    <button class="modalX" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<script>
const socket = io();
let selectedKey = null;
let currentAnalysis = null;      // last /api/analyze result, for re-render on toggle
let hideBuiltin = true;          // hide built-in-admin→infra "noise" edges by default
socket.on('log', m => appendLog(m.msg, m.level));
socket.on('done', d => {
  document.getElementById('collectBtn').disabled = false;
  if(d.ok){ appendLog(`[done] ${d.count} objects, ${d.principals} principals`,'info'); refreshStatus(); loadPrincipals(''); refreshQuery(); }
  else appendLog('[done] collection failed','error');
});
function appendLog(msg,level){const l=document.getElementById('log');const d=document.createElement('div');d.className=level||'info';d.textContent=msg;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function val(id){return document.getElementById(id).value.trim();}
function chk(id){return document.getElementById(id).checked;}
async function startCollect(){
  document.getElementById('log').innerHTML='';
  document.getElementById('collectBtn').disabled=true;
  const body={dc:val('dc'),username:val('username'),domain:val('domain'),password:val('password'),
    nthash:val('nthash'),kerberos:chk('kerberos'),ldaps:chk('ldaps'),aes_key:val('aes_key'),dc_ip:val('dc_ip'),
    gpo:chk('gpo'),host_mode:document.getElementById('host_mode').value,hosts:val('hosts'),
    session_mode:document.getElementById('session_mode').value};
  const r=await fetch('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();appendLog('[error] '+(e.error||r.status),'error');document.getElementById('collectBtn').disabled=false;}
}
async function importBloodhound(){
  const f=document.getElementById('bhFile').files[0];
  if(!f){appendLog('[bh] choose a BloodHound zip first','warn');return;}
  document.getElementById('log').innerHTML='';
  appendLog('[bh] uploading '+f.name+' ('+Math.round(f.size/1024)+' KB)…','info');
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await fetch('/api/import-bloodhound',{method:'POST',body:fd});
    const s=await r.json();
    if(!r.ok){appendLog('[bh] error: '+(s.error||r.status),'error');return;}
    appendLog(`[bh] imported ${s.count} objects / ${s.principals} principals (${s.domain})`,'info');
    refreshStatus();loadPrincipals('');refreshQuery();
    document.getElementById('collectBody').style.display='none';
    document.getElementById('collectCaret').textContent='▸';
  }catch(e){appendLog('[bh] upload failed: '+e.message,'error');}
}
async function refreshStatus(){const r=await fetch('/api/status');const s=await r.json();
  document.getElementById('status').textContent=s.collected?`${s.domain} · ${s.count} objects · ${s.principals} principals`:(s.collecting?'collecting…':'not collected');
  return s;}
async function loadSessions(){const r=await fetch('/api/sessions');const s=await r.json();
  const sel=document.getElementById('sessSel');s.sessions.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});}
async function loadSession(){const name=document.getElementById('sessSel').value;if(!name)return;
  const r=await fetch('/api/load-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const s=await r.json();if(s.ok){appendLog(`[session] loaded ${s.count} objects`,'info');refreshStatus();loadPrincipals('');refreshQuery();}else appendLog('[error] '+s.error,'error');}
let searchTimer;
// Which principal types are shown. Defaults to the selectable trio; GPO/OU/
// domain/container are opt-in via the filter chips.
const ALL_TYPES=['user','group','computer','gpo','ou','domain','container'];
const TYPE_LABEL={user:'Users',group:'Groups',computer:'Machines',gpo:'GPOs',ou:'OUs',domain:'Domain',container:'Containers'};
let activeTypes=new Set(['user','group','computer']);
let typeCounts={};
function debouncedSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadPrincipals(document.getElementById('search').value),200);}
function toggleType(t){
  if(activeTypes.has(t)){activeTypes.delete(t);} else {activeTypes.add(t);}
  if(activeTypes.size===0)activeTypes.add(t); // never allow an empty filter
  renderTypeChips();loadPrincipals(document.getElementById('search').value);
}
function setAllTypes(on){
  activeTypes = on ? new Set(ALL_TYPES) : new Set(['user','group','computer']);
  renderTypeChips();loadPrincipals(document.getElementById('search').value);
}
function renderTypeChips(){
  const wrap=document.getElementById('tfilter');if(!wrap)return;
  const allOn=ALL_TYPES.every(t=>activeTypes.has(t));
  let html=`<span class="tchip ${allOn?'on':''}" onclick="setAllTypes(${allOn?'false':'true'})">All</span>`;
  html+=ALL_TYPES.map(t=>{
    const c=typeCounts[t]||0;
    return `<span class="tchip ${activeTypes.has(t)?'on':''}" onclick="toggleType('${t}')">`+
           `${TYPE_LABEL[t]}<span class="cnt">${c}</span></span>`;
  }).join('');
  wrap.innerHTML=html;
}
async function loadPrincipals(q){
  const types=[...activeTypes].join(',');
  const r=await fetch('/api/principals?q='+encodeURIComponent(q||'')+'&types='+encodeURIComponent(types));
  if(!r.ok)return;const s=await r.json();const list=document.getElementById('plist');list.innerHTML='';
  if(s.counts){typeCounts=s.counts;renderTypeChips();}
  if(!s.principals.length){list.innerHTML='<div class="none" style="padding:.6rem">No matches.</div>';return;}
  s.principals.forEach(p=>{const d=document.createElement('div');d.className='pitem'+(p.key===selectedKey?' sel':'');
    d.onclick=()=>selectPrincipal(p.key,d);
    d.innerHTML=`<span class="pill ${p.class}">${p.class}</span><span>${esc(p.label)}</span>${p.admin_count?'<span class="broad">adminCount</span>':''}`;
    list.appendChild(d);});
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function selectPrincipal(key,el){
  selectedKey=key;document.querySelectorAll('.pitem').forEach(x=>x.classList.remove('sel'));if(el)el.classList.add('sel');
  const r=await fetch('/api/analyze/'+encodeURIComponent(key));const s=await r.json();
  if(!r.ok){alert(s.error);return;}currentAnalysis=s;renderDetail(s,key);
}
function edgeTable(edges,dir){
  const total=edges.length;
  const shown=hideBuiltin?edges.filter(e=>!e.builtin_noise):edges;
  const hidden=total-shown.length;
  const note=hidden>0
    ? `<div class="hidenote">${hidden} built-in ${hidden===1?'entry':'entries'} hidden `
      +`(built-in admin over system objects). Toggle “Show built-in” above to reveal.</div>`
    : '';
  if(!shown.length)return note||'<div class="none">None.</div>';
  const whoCol=dir==='out'?'Target':'Principal';
  // Stash the shown edges so a row click can look its edge up by index.
  window._edges=window._edges||{}; window._edges[dir]=shown;
  let rows=shown.map((e,i)=>{const who=dir==='out'?e.target_label:e.source_label;
    return `<tr class="${e.builtin_noise?'noiserow':''}" onclick="openEdge('${dir}',${i})" title="Click for detail, attack path & advice"><td><span class="sev ${e.severity}">${e.severity}</span></td>
      <td class="rt">${esc(e.right)}</td>
      <td>${esc(who)}${e.broad?'<span class="broad">BROAD</span>':''}${e.builtin_noise?'<span class="pill" style="margin-left:.3em">built-in</span>':''}</td>
      <td>${esc(e.target_class)}</td><td>${esc(e.via)}</td>
      <td class="scope">${esc(e.applies_to||'whole object')}</td></tr>`;}).join('');
  return note+`<table><thead><tr><th>Sev</th><th>Right</th><th>${whoCol}</th><th>Class</th><th>Via</th><th>Scope</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const CLS_COLOR={user:'#7fdcaa',group:'#9bbcf5',computer:'#f0cf6a',domain:'#e0a800',container:'#b06de0'};
// Friendly short aliases for the long/ugly rights so the arrow label stays inside
// its gap. Longest offenders are the AD extended attributes (RBCD / shadow creds).
const RIGHT_ALIAS={
  'msds-allowedtoactonbehalfofotheridentity':'RBCD',
  'msds-keycredentiallink':'shadow creds',
  'serviceprincipalname':'write SPN',
  'user-force-change-password':'force pw reset',
  'user-account-restrictions':'write UAC',
};
function shortRight(r){
  if(/^HasSession/.test(r||''))return 'has session';   // "HasSession (privileged) — steal creds"
  let s=(r||'').replace(/^(WriteProperty|ExtendedRight):/,'').replace(/\s*\(.*\)$/,'').trim();
  const alias=RIGHT_ALIAS[s.toLowerCase()];
  if(alias)return alias;
  return s.length>18?s.slice(0,17)+'…':s;   // hard cap to what fits the gap
}
function chainSvg(chain,right){
  const n=chain.length; if(!n)return '';
  // Per-node VARIABLE box widths: each box is sized to fully fit its own label
  // (node names are never truncated — important for reporting), so a long name
  // like "joffrey.baratheon" gets a wider box while short names stay compact.
  // Boxes are laid out with a running x offset rather than a fixed stride, and
  // the SVG scales to the modal width via viewBox, so the graphic just gets a
  // taller aspect ratio (and scrolls if very long) instead of clipping text.
  // gap only has to hold the arrow's centered label ("member of" ≈ 50px, or an
  // aliased/capped right ≈ up to 95px) — 110 is comfortable without wasting space.
  const boxH=46, gap=110, padY=24, padX=10;
  const NAME_PX=6.6, CLASS_PX=5.2, MINW=104, BOXPAD=22;   // ~char widths at the label font sizes
  // A box must fit the widest of its two lines: the name (11px) and the class (9px).
  const boxWidth=(node)=>Math.max(MINW,
    Math.ceil((node.label||'').length*NAME_PX)+BOXPAD,
    Math.ceil((node.class||'').length*CLASS_PX)+BOXPAD);
  const widths=chain.map(boxWidth);
  // x-offset of each box's left edge.
  const xs=[]; let cur=padX;
  chain.forEach((_,i)=>{xs.push(cur); cur+=widths[i]+gap;});
  const W=cur-gap+padX, H=boxH+padY*2+14;
  // Explicit intrinsic width/height so the SVG renders at native scale (text stays
  // legible); the wrapping div scrolls horizontally when the chain is wider than
  // the modal, rather than the whole graphic shrinking until text is unreadable.
  let parts=[`<svg class="chainSvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`];
  chain.forEach((node,i)=>{
    const x=xs[i], bw=widths[i], cx=x+bw/2, y=padY, col=CLS_COLOR[node.class]||'#8b8d93';
    // arrow from previous box; label = the right (into the target) or "member of"
    if(i>0){const px=xs[i-1]+widths[i-1], ay=y+boxH/2;   // previous box right edge
      const isTarget=node.role==='target';
      const lblTxt=isTarget?shortRight(right):'member of';
      const lblCol=isTarget?'#e5484d':'#8b8d93';
      parts.push(`<line x1="${px}" y1="${ay}" x2="${x-6}" y2="${ay}" stroke="${isTarget?'#e5484d':'#666'}" stroke-width="1.5" marker-end="url(#arw${isTarget?'r':''})"/>`);
      // <title> keeps the full untruncated right on hover.
      parts.push(`<text x="${(px+x)/2}" y="${ay-7}" fill="${lblCol}" font-size="9.5" font-weight="${isTarget?'700':'400'}" text-anchor="middle">${isTarget?`<title>${esc(right)}</title>`:''}${esc(lblTxt)}</text>`);}
    parts.push(`<rect x="${x}" y="${y}" width="${bw}" height="${boxH}" rx="7" fill="${col}22" stroke="${col}" stroke-width="1.4"/>`);
    parts.push(`<text x="${cx}" y="${y+19}" fill="#e7e7ea" font-size="11" font-weight="600" text-anchor="middle">${esc(node.label)}</text>`);
    parts.push(`<text x="${cx}" y="${y+33}" fill="${col}" font-size="9" text-anchor="middle">${esc(node.class)}</text>`);
    parts.push(`<text x="${cx}" y="${y+boxH+13}" fill="#8b8d93" font-size="8.5" text-anchor="middle">${esc(node.note||node.role)}</text>`);
  });
  parts.push('<defs>'
    +'<marker id="arw" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker>'
    +'<marker id="arwr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e5484d"/></marker>'
    +'</defs>');
  parts.push('</svg>');
  return `<div class="chainWrap">${parts.join('')}</div>`;
}

}

function toggleCollect(){
  const b=document.getElementById('collectBody');const c=document.getElementById('collectCaret');
  const hidden=b.style.display==='none';b.style.display=hidden?'block':'none';c.textContent=hidden?'▾':'▸';
}
function toggleQueries(){
  const b=document.getElementById('queriesBody');const c=document.getElementById('queriesCaret');
  const hidden=b.style.display==='none';b.style.display=hidden?'block':'none';c.textContent=hidden?'▾':'▸';
}
// ---- Queries panel ----
let queryDefs=[];
async function loadQueries(){
  try{
    const r=await fetch('/api/queries');if(!r.ok)return;
    queryDefs=(await r.json()).queries||[];
    const sel=document.getElementById('querySelect');
    sel.innerHTML='<option value="">— pick a query —</option>'+
      queryDefs.map(q=>`<option value="${q.id}">${esc(q.label)}</option>`).join('');
  }catch(e){/* GUI standalone */}
}
function onQueryPick(){
  const id=document.getElementById('querySelect').value;
  const def=queryDefs.find(q=>q.id===id);
  document.getElementById('queryDesc').textContent=def?def.description:'';
  document.getElementById('queryMeta').textContent='';
  const list=document.getElementById('qlist');
  if(!id){list.style.display='none';list.innerHTML='';return;}
  runQuery(id);
}
// Re-run the currently-selected query after new data is loaded.
function refreshQuery(){const id=document.getElementById('querySelect').value;if(id)runQuery(id);}
async function runQuery(id){
  const meta=document.getElementById('queryMeta');const list=document.getElementById('qlist');
  meta.textContent='running…';list.style.display='block';list.innerHTML='';
  const r=await fetch('/api/query/'+encodeURIComponent(id));
  if(!r.ok){const e=await r.json().catch(()=>({}));meta.textContent='error: '+(e.error||r.status);return;}
  const s=await r.json();
  meta.textContent=`${s.count} result${s.count===1?'':'s'}`;
  if(!s.results.length){list.innerHTML='<div class="none" style="padding:.6rem">No matches.</div>';return;}
  s.results.forEach(p=>{
    const hasMembers=p.class==='group'&&p.member_count>0;
    const d=document.createElement('div');d.className='pitem'+(p.key===selectedKey?' sel':'');
    // caret (groups only) → toggles member sublist; row body → selects principal
    const caret=hasMembers?`<span class="qcaret" data-open="0">▸</span>`:'<span class="qcaret ph"></span>';
    const cnt=hasMembers?`<span class="mcount" title="transitive members">${p.member_count}👤</span>`:'';
    d.innerHTML=caret+`<span class="pill ${p.class}">${p.class}</span><span class="plabel">${esc(p.label)}</span>`+
      cnt+(p.note?`<span class="note" title="${esc(p.note)}">${esc(p.note)}</span>`:'');
    // member sublist container (collapsed), created up-front so the click closure can capture it
    let sub=null;
    if(hasMembers){sub=document.createElement('div');sub.className='msub';sub.style.display='none';}
    d.onclick=(ev)=>{
      if(ev.target.classList.contains('qcaret')){ev.stopPropagation();toggleMembers(d,p,sub);return;}
      selectPrincipal(p.key,d);
    };
    list.appendChild(d);
    if(sub)list.appendChild(sub);
  });
}
function toggleMembers(rowEl,p,subEl){
  const caret=rowEl.querySelector('.qcaret');const open=caret.dataset.open==='1';
  caret.dataset.open=open?'0':'1';caret.textContent=open?'▸':'▾';
  if(!subEl)return;
  if(open){subEl.style.display='none';return;}
  subEl.style.display='block';
  if(subEl.dataset.filled==='1')return;
  subEl.innerHTML='';
  (p.members||[]).forEach(m=>{
    const el=document.createElement('div');el.className='mitem';
    el.innerHTML=`<span class="pill ${m.class}">${m.class}</span><span>${esc(m.label)}</span>`+
      (m.enabled===false?'<span class="mdis">disabled</span>':'');
    el.onclick=()=>selectPrincipal(m.key,null);
    subEl.appendChild(el);
  });
  if(!(p.members||[]).length){
    const n=document.createElement('div');n.className='mnote';n.textContent='No resolvable members.';subEl.appendChild(n);
  }
  if(p.members_truncated){
    const n=document.createElement('div');n.className='mnote';
    n.textContent=`…showing first ${p.members.length} of ${p.member_count}`;subEl.appendChild(n);
  }
  subEl.dataset.filled='1';
}
async function applyPrefill(){
  try{
    const r=await fetch('/api/prefill');const p=await r.json();
    if(!p.has_creds)return;
    const set=(id,v)=>{const el=document.getElementById(id);if(el!=null&&v!=null&&v!=='')el.value=v;};
    set('dc',p.dc);set('username',p.username);set('domain',p.domain);
    set('password',p.password);set('nthash',p.nthash);set('aes_key',p.aes_key);set('dc_ip',p.dc_ip);
    document.getElementById('kerberos').checked=!!p.kerberos;
    document.getElementById('ldaps').checked=!!p.ldaps;
    document.getElementById('gpo').checked=p.gpo!==false;
    if(p.host_mode){const hm=document.getElementById('host_mode');hm.value=p.host_mode;
      document.getElementById('hostsRow').style.display=p.host_mode==='list'?'block':'none';set('hosts',p.hosts);}
    if(p.autostart){
      // creds came from the CLI — start collecting immediately and collapse the form
      appendLog('[prefill] credentials supplied on command line — auto-starting collection','info');
      startCollect();
      document.getElementById('collectBody').style.display='none';
      document.getElementById('collectCaret').textContent='▸';
    }
  }catch(e){/* no prefill endpoint / GUI opened standalone */}
}
// Boot sequence. If a store is ALREADY loaded server-side on first paint — e.g.
// the CLI preloaded a BloodHound file (--bloodhound), or the page was refreshed
// after data was collected — populate the principals list and queries too, so the
// left panel isn't stuck on the "collect first" placeholder while data exists.
(async function boot(){
  const s=await refreshStatus();
  loadSessions();loadQueries();applyPrefill();
  if(s&&s.collected){loadPrincipals('');refreshQuery();}
})();
</script>
