[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adcontrol"
version = "0.1.0"
description = "Active Directory object-control / permission analyzer — maps what a principal can control (outbound) and who can control it (inbound) from AD object DACLs, group membership, GPO-delivered rights, and per-host RDP/logon rights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "impacket>=0.12.0",
    "ldap3==2.9.1",
    "flask>=3.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Reuses certipy's own MS-CRTD flag-bit tables + EKU OID names for the
# certificate-template detail view. ESC detection works without it; only the
# decoded-flag-names display degrades to raw hex if absent.
adcs = ["certipy-ad>=5.0"]

[project.scripts]
adcontrol-scan = "adcontrol_scan:main"
adcontrol-web = "adcontrol_web:main"

[tool.setuptools]
py-modules = ["adcontrol_scan", "adcontrol_web"]

[tool.setuptools.packages.find]
include = ["adcontrol*"]

[tool.setuptools.package-data]
adcontrol = ["templates/*.html"]
