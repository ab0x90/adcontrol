[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adcontrol"
version = "0.1.0"
description = "Active Directory object-control / permission analyzer — maps what a principal can control (outbound) and who can control it (inbound) from AD object DACLs, group membership, GPO-delivered rights, and per-host RDP/logon rights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "impacket>=0.12.0",
    "ldap3==2.9.1",
    "flask>=3.0",
    "flask-socketio>=5.3",
]

[project.scripts]
adcontrol = "adcontrol.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["adcontrol*"]

[tool.setuptools.package-data]
adcontrol = ["templates/*.html"]
